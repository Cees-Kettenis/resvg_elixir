[package]
name = "resvg"
version = "0.1.0"
# We don't use versioning in the in this crate.
# Please check the `mix.exs` file at the root of this project for the current version.
edition = "2018"

[lib]
name = "resvg"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
resvg = { git = "https://github.com/Cees-Kettenis/resvg.git", rev = "fd5af37ef2f17d649da846bda7004733b4ff9cc4" }
svgtypes = "0.16"
rustler = "0.33.0"
tiny-skia = "0.12"
usvg = { git = "https://github.com/Cees-Kettenis/resvg.git", rev = "fd5af37ef2f17d649da846bda7004733b4ff9cc4" }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
