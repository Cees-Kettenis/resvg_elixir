[package]
name = "resvg_elixir"
version = "0.1.0"
# The package release version is defined in mix.exs.
edition = "2018"

[lib]
name = "resvg_elixir"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
resvg = { git = "https://github.com/Cees-Kettenis/resvg.git", rev = "5464662c0ec59ecc830c52418673b322da1791b5" }
svgtypes = "0.16"
rustler = "0.33.0"
tiny-skia = "0.12"
usvg = { git = "https://github.com/Cees-Kettenis/resvg.git", rev = "5464662c0ec59ecc830c52418673b322da1791b5" }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
